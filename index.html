<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}

</style></head><body><canvas id="c"></canvas><script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,S=1;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);S=Math.max(H,W/1.778)}
addEventListener('resize',rs);rs();

const LW=3.6,HALF=LW*2,LANES=[-5.4,-1.8,1.8,5.4],FAR=520,CH=1.15,SPAWN_BUF=160,TRAFFIC_K=1.7,GRAV_K=6;   // GRAV_K — игровое усиление силы тяжести на уклонах (реальные углы на трассе небольшие)   // FAR — дальность отрисовки; трафик создаётся за её пределами (FAR+40…FAR+SPAWN_BUF)

const TYPES={car:{w:1.8,h:1.45,L:4.4,v:[22,32]},truck:{w:2.5,h:3.6,L:10,v:[15,20]},bus:{w:2.55,h:3.2,L:12,v:[17,23]}};
const K={L:['ArrowLeft','KeyA'],R:['ArrowRight','KeyD'],U:['ArrowUp','KeyW'],D:['ArrowDown','KeyS']};
let VMAX=68,CAR,KG,MAXS=280,MSTEP=40,bump=0,sel=0,gi=0,gFrom='menu',own=[0],coins=0,lastGain=0,vol=.8,dens=3,srow=0,sFrom='menu',manual=true;   // manual — механическая коробка (Shift вверх, Ctrl вниз); false — автомат

const DENS=[6,8,11,14,17];
// момент двигателя: нормирован на отсечку машины; tq=[начало,конец] «полки» максимума в долях отсечки
function Tn(r){const f=r/CAR.rl,a=CAR.tq[0],b=CAR.tq[1];if(f<=.11)return .35;if(f<a)return .35+.65*(f-.11)/(a-.11);if(f<=b)return 1;return Math.max(.5,1-.28*(f-b)/(1.04-b))}

// ДОБАВЛЕНО: mass (масса) и cog (центр тяжести) для каждой машины
const CARS=[
 {name:'Honda Civic',price:0,v:62,a:5,h:1,cyl:2,col:'#FFFF00',cab:1, n:6, rl:7000, idle:800, tmax:8, tq:[.31,.57], mass:1100, cog:0.015, snd: { p:2, h:[1, 2, 0.5, 1.5, 4], v:[0.6, 0.4, 0.1, 0.1, 0.05], fb:280}},
 {name:'Subaru WRX STI',price:4000,v:70,a:6.2,h:1.05,cyl:2.2,col:'#2d6cdf',cab:.9, n:6, rl:6700, idle:750, tmax:8, tq:[.45,.72], mass:1500, cog:0.01, pops:true, snd: { p:2, h:[1, 2, 0.5, 0.75, 1.5], v:[0.5, 0.1, 0.6, 0.5, 0], fb:200 }},
 {name:'Mazda RX-7',price:7500,v:78,a:7.5,h:1.12,cyl:2.6,col:'#e0a020',cab:.8, n:5, rl:8000, idle:800, tmax:9, red:7000, tq:[.5,.75], mass:1300, cog:0.009, pops:true, snd: { p:3, h:[1, 2, 0.5, 3, 4], v:[0.3, 0.1, 0.1, 0.7, 0.4], fb:350 }},
 {name:'Corvette',price:12500,v:85,a:8.2,h:1.2,cyl:3.2,col:'#27ae60',cab:.65, n:8, rl:6600, idle:700, tmax:8, tq:[.62,.85], mass:1600, cog:0.008, pops:true, snd: { p:4, h:[1, 2, 0.5, 1.5, 0.25], v:[0.7, 0.2, 0.7, 0.1, 0.2], fb:180 }},
 {name: 'BMW M5', price: 18000,v:88.88,a:8.8,h:1.18,cyl:0.4,col: '#eeeeee',cab:.75, n:8, rl:7200, idle:700, tmax:8, tq:[.25,.81], mass:1800, cog:0.012, pops:true, snd: { p:5, h:[1, 2, 0.5, 1.5, 2.5], v:[0.5, 0.4, 0.2, 0.4, 0.2], fb:250 }},
 {name: 'Ferrari 812', price: 25000,v:100,a:9.5,h:1.2,cyl:8,col: '#ff2800',cab:.65, n:7, rl:9500, idle:1000, tmax:10, tq:[.7,.88], mass:1650, cog:0.006, pops:true, snd: { p:6, h:[1, 2, 0.5, 1.5, 3], v:[0.4, 0.2, 0.1, 0.6, 0.5], fb:320 }}],held={},tm=a=>Math.max(...a.map(k=>held[k]||0));
let state='menu',best=0,P,cars,shake=0,flash=0,popup='',popT=0,last=0;
try{best=+localStorage.getItem('tr_best')||0}catch(e){}
try{coins=+localStorage.getItem('tr_coins')||0;own=(localStorage.getItem('tr_own')||'0').split(',').map(Number).filter(n=>n>=0&&n<CARS.length);sel=+localStorage.getItem('tr_sel')||0;const sv=localStorage.getItem('tr_vol'),sd=localStorage.getItem('tr_dens');{const sm=localStorage.getItem('tr_mt');if(sm!==null)manual=sm==='1'}if(sv!==null)vol=Math.max(0,Math.min(1,+sv));if(sd!==null)dens=Math.max(1,Math.min(5,+sd||3))}catch(e){}
if(!own.includes(sel))sel=0;
function applyCar(){CAR=CARS[sel];VMAX=CAR.v;KG=[];for(let i=0;i<CAR.n;i++)KG.push(CAR.rl/(VMAX*Math.pow(.3,(CAR.n-1-i)/(CAR.n-1))));const top=VMAX*3.6;MSTEP=[20,30,40,50,60].find(m=>Math.ceil(top/m)<=7)||60;MAXS=Math.ceil(top/MSTEP)*MSTEP;CAR.cd=(CAR.a*Tn(CAR.rl)*KG[CAR.n-1]/KG[0]*.98-.35)/(VMAX*VMAX)}
function save(){try{localStorage.setItem('tr_coins',coins);localStorage.setItem('tr_own',own.join(','));localStorage.setItem('tr_sel',sel);localStorage.setItem('tr_vol',vol);localStorage.setItem('tr_dens',dens);localStorage.setItem('tr_mt',manual?'1':'0')}catch(e){}applyCar()}
applyCar();
function garageKey(c){
  if(c==='ArrowLeft'||c==='KeyA')gi=(gi+CARS.length-1)%CARS.length;
  else if(c==='ArrowRight'||c==='KeyD')gi=(gi+1)%CARS.length;
  else if(c==='Enter'||c==='Space'){const k=CARS[gi];
    if(own.includes(gi)){sel=gi;save()}
    else if(coins>=k.price){coins-=k.price;own.push(gi);sel=gi;save()}
    else{popup='Не хватает монет';popT=1.4}}
  else if(c==='Escape'||c==='KeyG'||c==='Backspace')state=gFrom;
}

addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
  if(e.ctrlKey&&['KeyS','KeyD','KeyP','KeyA'].includes(e.code))e.preventDefault();   // Ctrl — понижающая, не даём браузеру перехватить
  if(e.repeat)return;
  held[e.code]=performance.now();sfx.init();if(e.code==='KeyM')sfx.toggle();
  if(state==='play'&&manual&&P.crash===0){
    if(e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='KeyE')shiftGear(1);
    else if(e.code==='ControlLeft'||e.code==='ControlRight'||e.code==='KeyQ')shiftGear(-1);
  }
  if(state==='garage'){garageKey(e.code);return}
  if(state==='settings'){settingsKey(e.code);return}
  if(e.code==='KeyT'){manual=!manual;save();popup=manual?'Коробка: механика':'Коробка: автомат';popT=1.4}
  if(e.code==='KeyO'&&(state==='menu'||state==='over'||state==='pause')){sFrom=state;state='settings';return}
  if(e.code==='KeyG'&&(state==='menu'||state==='over')){gFrom=state;gi=sel;state='garage';return}
  if(e.code==='Space'||e.code==='Enter'){if(state==='pause')state='play';else if(state!=='play')start()}
  if(e.code==='KeyP'||e.code==='Escape'){if(state==='play')state='pause';else if(state==='pause')state='play'}
  if(e.code==='KeyR'&&state!=='menu')start();
});
addEventListener('keyup',e=>{held[e.code]=0});
addEventListener('blur',()=>{for(const k in held)held[k]=0;if(state==='play')state='pause'});

const sfx=(()=>{
  let ac,NB,mst,o=[],eg,egFront,ef,wg,wf,tg,qg,engPan,exhPan,mute=false,lastScr=0;
  const noise=()=>{const s=ac.createBufferSource();s.buffer=NB;s.loop=true;s.start();return s};
  const chain=(src,type,fq,q,gain)=>{const f=ac.createBiquadFilter();f.type=type;f.frequency.value=fq;f.Q.value=q;const g=ac.createGain();g.gain.value=gain;src.connect(f);f.connect(g);g.connect(mst);return[f,g]};
  function init(){
    if(ac)return;
    try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
    NB=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const cmp=ac.createDynamicsCompressor();mst=ac.createGain();mst.gain.value=vol;mst.connect(cmp);cmp.connect(ac.destination);
    const setPos=(p,x,y,z)=>{if(p.positionX){p.positionX.value=x;p.positionY.value=y;p.positionZ.value=z}else if(p.setPosition)p.setPosition(x,y,z)};
    const lis = ac.listener;
    if(lis.positionX) { lis.positionX.value=0; lis.positionY.value=0; lis.positionZ.value=0; lis.forwardX.value=0; lis.forwardY.value=0; lis.forwardZ.value=-1; } 
    else if(lis.setPosition) { lis.setPosition(0,0,0); lis.setOrientation(0,0,-1,0,1,0); }
    engPan = ac.createPanner(); engPan.panningModel = 'HRTF'; setPos(engPan,0,-0.4,-1.5);
    exhPan = ac.createPanner(); exhPan.panningModel = 'HRTF'; setPos(exhPan,0,-0.4,2.5);
    const cabinOut = ac.createBiquadFilter(); cabinOut.type = 'lowpass'; cabinOut.frequency.value = 1600; 
    cabinOut.connect(mst); engPan.connect(cabinOut); exhPan.connect(cabinOut);
    const ws=ac.createWaveShaper(),cr=new Float32Array(256);for(let i=0;i<256;i++)cr[i]=Math.tanh((i/128-1)*2.2);ws.curve=cr;
    ef=ac.createBiquadFilter();ef.type='lowpass';ef.Q.value=1.5;
    eg=ac.createGain();eg.gain.value=0; egFront=ac.createGain();egFront.gain.value=0; 
    const mixFront = ac.createGain(); mixFront.connect(egFront); egFront.connect(engPan);
    ws.connect(ef); ef.connect(eg); eg.connect(exhPan);
    
    // Инициализируем 5 осцилляторов разных форм (пила, квадрат, синусоиды)
    // Сохраняем не только сам осциллятор, но и его Gain (громкость), чтобы крутить их на лету
    for(const [t, isFront] of [['sawtooth',true], ['square',true], ['sawtooth',false], ['sine',false], ['sine',false]]){
      const s=ac.createOscillator(),gg=ac.createGain();s.type=t;gg.gain.value=0;s.connect(gg);
      gg.connect(isFront ? mixFront : ws); s.start(); o.push([s, gg]);
    }
    [wf,wg]=chain(noise(),'lowpass',400,.5,0); [,tg]=chain(noise(),'lowpass',220,.7,0); [,qg]=chain(noise(),'bandpass',1800,8,0);
  }
  function burst(type,f1,f2,q,gain,dur){
    if(!ac||mute)return;const t=ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
    s.buffer=NB;s.loop=true;f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f1,t);f.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+dur*.25);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(mst);s.start(t);s.stop(t+dur+.05);
  }
  function tone(f1,f2,dur,gain,type='sine',delay=0){
    if(!ac||mute)return;const t=ac.currentTime+delay,s=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();
    s.type=type;f.type='lowpass';f.frequency.value=1800;s.frequency.setValueAtTime(f1,t);s.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.02);g.gain.setValueAtTime(gain,t+dur*.7);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(mst);s.start(t);s.stop(t+dur+.05);
  }
  return{
    init,
    setVol(){if(mst)mst.gain.setTargetAtTime(vol,ac.currentTime,.02)},
    bonus(n){tone(740+n*90,1100+n*90,.14,.1);tone(1100+n*90,1500+n*90,.2,.08,'sine',.09)},
    toggle(){mute=!mute;if(ac)mute?ac.suspend():ac.resume();popup=mute?'Звук выкл':'Звук вкл';popT=1},
    stall(){tone(150,40,.55,.35,'sawtooth');burst('lowpass',500,70,.8,.5,.5)},
    shift(){burst('bandpass',3200,1500,1.5,.12,.16);tone(95,60,.08,.15,'square')},
    scrape(){const n=performance.now();if(n-lastScr>180){lastScr=n;burst('bandpass',2500,1800,2,.25,.25)}},
    crash(){burst('lowpass',2500,80,.8,1.2,1.1);burst('highpass',3000,800,.7,.6,.5);tone(110,35,.6,.9)},
    pass(){burst('bandpass', 2500, 400, 0.8, 0.15, 0.35)},
    pop(){
      if(!ac||mute)return; const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = NB; s.loop = true; f.type = 'bandpass'; f.frequency.value = 140 + Math.random()*200; f.Q.value = 1.1; 
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(4.0 + Math.random()*2.0, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + .15 + Math.random()*.15);
      s.connect(f); f.connect(g); g.connect(exhPan); s.start(t); s.stop(t + .4);
    },
    update(){
      if(!ac)return; if(state==='pause'||mute){if(ac.state==='running')ac.suspend();return}
      if(ac.state==='suspended')ac.resume();
      
      const t=ac.currentTime, vn=P.v/VMAX, run=state==='play'&&P.crash===0&&!(P.stall>0), thr=run?P.thr:0;
      const snd = CAR.snd; // Забираем настройки звука текущей машины
      const f = (P.rpm / 60) * snd.p; // Базовая частота
      
      // Динамически применяем гармоники и их громкость для текущей машины
      for(let i=0; i<o.length; i++) {
        o[i][0].frequency.setTargetAtTime(f * snd.h[i], t, .03); // Управляем питчем обертона
        o[i][1].gain.setTargetAtTime(snd.v[i], t, .03);          // Управляем громкостью обертона
      }
      
      ef.frequency.setTargetAtTime(snd.fb + P.rpm*.22 + thr*450, t, .05); // Базовая частота фильтра
      eg.gain.setTargetAtTime(run?(.28+.20*thr+.15*P.rpm/CAR.rl)*(P.sh>0?.45:1)*(P.lim>0?.12:1)*(1-.55*P.bog*(Math.sin(t*30)>0?1:0)):0,t,.01+.03*(P.lim>0?0:1));
      egFront.gain.setTargetAtTime(run?(.08+.05*thr+.03*P.rpm/CAR.rl):0,t,.04); 
      wf.frequency.setTargetAtTime(300+vn*1100,t,.1);wg.gain.setTargetAtTime(vn*vn*.2*(P.crash>0?.3:1),t,.1);
      tg.gain.setTargetAtTime(vn*.16,t,.1); qg.gain.setTargetAtTime(run?Math.max(0,Math.abs(P.vx)-4)*vn*.03:0,t,.05);
    }
  };
})();
function start(){applyCar();initRoad();
  P={x:LANES[2],vx:0,v:40/3.6,s:0,thr:0,brk:0,z:0,bonus:0,combo:0,comboT:0,roll:0,crash:0,rpm:CAR.idle,gear:1,pk:0,pkv:0,sh:0,gt:0,popCd:0,offGasT:0,head:0,lim:0,stall:0,stallT:0,bog:0,bogMsg:0};
  for(let g=1;g<=CAR.n;g++)if(P.v*KG[g-1]>=CAR.rl*.4)P.gear=g;
  cars=[];shake=0;flash=0;popT=0;state='play';
  {const N=Math.round(DENS[dens-1]*TRAFFIC_K);for(let i=0;i<N;i++)spawn(45+i*(FAR+SPAWN_BUF-60)/N)}
}
function spawn(zr){
  for(let n=0;n<8;n++){
    const r=Math.random(),k=r<.62?'car':r<.82?'truck':'bus',T=TYPES[k],ln=Math.random()*4|0,z=P.z+zr+Math.random()*20;
    if(cars.some(c=>c.ln===ln&&Math.abs(c.z-z)<34))continue;
    const band=new Set(cars.filter(c=>Math.abs(c.z-z)<26).map(c=>c.ln));band.add(ln);
    if(band.size>2)continue;
    const car=k==='car',vv0=T.v[0]+Math.random()*(T.v[1]-T.v[0]);let ahead=null;for(const o of cars)if(o.ln===ln&&o.z>z&&(!ahead||o.z<ahead.z))ahead=o;const vv=ahead&&ahead.z-z<80?Math.min(vv0,ahead.v):vv0;
    cars.push({k,T,ln,x:LANES[ln],z,v0:vv0,v:vv,home:ln,cd:0,
      hue:car?Math.random()*360|0:[210,25,0,140,50][Math.random()*5|0],
      sat:car?55+Math.random()*30:40,lig:car?35+Math.random()*25:k==='bus'?50:55+Math.random()*15,gap:9,passed:false,nt:4+Math.random()*8});
    return;
  }
}
// ручное переключение: d=+1 вверх, d=-1 вниз
const lugRpm=()=>Math.max(CAR.idle*1.5,CAR.rl*.2);   // ниже этих оборотов двигатель «захлёбывается»
function shiftGear(d){
  const n=P.gear+d;if(n<1||n>CAR.n)return;
  const wrN=P.v*KG[n-1],rl=CAR.rl;
  if(d<0&&wrN>rl*1.25){popup='Слишком высокие обороты';popT=1.1;return}
  P.gear=n;P.sh=.3;P.gt=.15;sfx.shift();
  if(d>0){
    const lug=lugRpm();
    if(wrN<lug){const sev=Math.min(1,(lug-wrN)/(lug-CAR.idle*.8));P.v=Math.max(0,P.v-sev*1.6);P.pkv+=.25+.35*sev;bump=Math.max(bump,.5+.5*sev);   // рывок на низких оборотах
      if(wrN<CAR.idle*.6&&n>1)stallEngine()}
    else P.pkv+=.12;
  }else{
    if(wrN>rl*.9){P.v=Math.max(0,P.v-(wrN/rl-.9)*5);P.pkv-=.22;bump=Math.max(bump,.6)}     // подтормаживание двигателем при грубом сбросе
    else P.pkv-=.08;
  }
}
function stallEngine(){if(P.stall>0)return;P.stall=1.6;P.stallT=0;popup='ДВИГАТЕЛЬ ЗАГЛОХ';popT=1.6;sfx.stall()}
function near(c){
  P.combo=P.comboT>0?P.combo+1:1;P.comboT=2.5;
  const b=50*Math.min(P.combo,5);P.bonus+=b;popup='БЛИЗКИЙ ОБГОН +'+b+(P.combo>1?'  ×'+P.combo:'');popT=1.4;
}
function hit(){sfx.crash();P.crash=.001;shake=1;flash=1;P.roll=(Math.random()<.5?-1:1)*.1;popup='';}
const score=()=>(P.z/10|0)+P.bonus;

function step(dt){
  const crashed=P.crash>0,L=tm(K.L),R=tm(K.R),U=tm(K.U),D=tm(K.D);
  const dir=L&&R?(L>R?-1:1):L?-1:R?1:0,vn=P.v/VMAX,ck=kAt(P.z),gs=gAt(P.z);P.head+=ck*P.v*dt;bump*=Math.exp(-7*dt);if(state==='play'&&P.crash===0&&Math.random()<dt*.12*Math.min(1,P.v/60))bump=.35+Math.random()*.45;
  if(state==='menu'){P.v=24;P.s=0}
  else if(!crashed){
    P.thr+=((U?1:0)-P.thr)*Math.min(1,dt*(U?5:9));
    P.brk+=((D?1:0)-P.brk)*Math.min(1,dt*12);
    const wr=P.v*KG[P.gear-1],rl=CAR.rl;   // обороты со стороны колёс
    P.lim=Math.max(0,P.lim-dt);
    let bog=0,cut=false,over=0;
    if(manual){
      if(P.stall>0){P.stall-=dt;if(P.stall<=0){P.stall=0;P.rpm=CAR.idle;popup='Двигатель запущен';popT=1}}
      // отсечка: на пределе оборотов подача топлива прерывается — машина «долбится» в ограничитель и тормозится двигателем
      if(wr>=rl*.995&&P.thr>.05&&P.lim<=0&&P.stall<=0&&P.sh<=0)P.lim=.11;
      over=Math.max(0,wr/rl-1);
      cut=P.lim>0||P.stall>0||over>.005;

  g=ctx.createLinearGradient(0,p(0,.6)[1],0,p(0,.66)[1]);g.addColorStop(0,'#1d1e24');g.addColorStop(1,'rgba(14,15,18,0)');
  ctx.fillStyle=g;ctx.fillRect(p(.29,0)[0],p(0,.6)[1],W,S*.06);
  const [dx0,dy0]=p(.65,.64),[dx1,dy1]=p(.84,.73);
  ctx.fillStyle='#050607';ctx.strokeStyle='#23252b';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(dx0,dy0,dx1-dx0,dy1-dy0,6);ctx.fill();ctx.stroke();
  const gx1=W/2-.085*S,gx2=W/2+.085*S,gy=H-.26*S,r=.062*S;
  ctx.fillStyle='#08080a';ctx.strokeStyle='#1f2127';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(gx1-r*1.35,gy-r*1.25,gx2-gx1+r*2.7,r*2.5,r*.5);ctx.fill();ctx.stroke();
  const kmh=P.v*3.6;
  dial(gx1,gy,r,kmh,MAXS,MSTEP/2,i=>i%2===0?String(i*MSTEP/2):'');
  dial(gx2,gy,r,P.rpm,CAR.tmax*1000,1000,i=>String(i),CAR.red||CAR.rl-500);
  ctx.fillStyle='#fff';ctx.textAlign='center';
  ctx.font=`700 ${r*.22}px system-ui,sans-serif`;ctx.fillText(Math.round(kmh),gx1,gy+r*.62);
  ctx.font=`700 ${r*.26}px system-ui,sans-serif`;ctx.fillText(P.gear,gx2,gy+r*.62);
  ctx.font=`600 ${r*.15}px system-ui,sans-serif`;ctx.fillStyle=manual?'#ffe14d':'#8a90a0';ctx.fillText(manual?(P.stall>0?'СТОП':P.lim>0?'ОТСЕЧКА':'МКПП'):'АКПП',gx2,gy+r*.82);ctx.fillStyle='#fff';
  const [hx,hy2]=p(.5,.92),R=.3*S;
  ctx.save();ctx.translate(hx,hy2);ctx.rotate(P.s*.85+Math.max(-.9,Math.min(.9,curveK*120)));ctx.lineCap='round';
  ctx.strokeStyle='#121316';ctx.lineWidth=R*.2;ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.stroke();
  ctx.strokeStyle='#2a2c33';ctx.lineWidth=R*.02;ctx.beginPath();ctx.arc(0,0,R*1.06,Math.PI*1.15,Math.PI*1.85);ctx.stroke();
  ctx.setLineDash([R*.04,R*.04]);ctx.strokeStyle='#5a5d66';ctx.lineWidth=R*.012;ctx.beginPath();ctx.arc(0,0,R*.93,0,7);ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle='#121316';ctx.lineWidth=R*.2;ctx.beginPath();ctx.moveTo(-R,0);ctx.lineTo(R,0);ctx.moveTo(0,0);ctx.lineTo(0,R);ctx.stroke();
  ctx.fillStyle='#0d0e11';ctx.strokeStyle='#2a2c33';ctx.lineWidth=R*.015;ctx.beginPath();ctx.arc(0,0,R*.34,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle=CAR.col;ctx.beginPath();ctx.arc(0,0,R*.08,0,7);ctx.fill();
  ctx.fillStyle=CAR.col;ctx.fillRect(-R*.012,-R*1.1,R*.024,R*.2);
  ctx.restore();ctx.restore();
}

function text(t,x,y,size,col,al='center',w='700'){ctx.font=`${w} ${size}px system-ui,'Segoe UI',sans-serif`;ctx.textAlign=al;ctx.fillStyle=col;ctx.fillText(t,x,y)}
function hud(){if(state==='menu'||state==='garage'||state==='settings')return;
  const u=Math.max(14,Math.min(W,H)*.03);
  text('ОЧКИ '+score(),W-20,u*1.6,u*1.3,'#fff','right');
  text('Дистанция '+(P.z/1000).toFixed(2)+' км · Рекорд '+best,W-20,u*2.9,u*.9,'#ffd9a0','right','500');
  if(popT>0){ctx.globalAlpha=Math.min(1,popT);text(popup,W/2,H*.22,u*1.6,'#ffe14d');ctx.globalAlpha=1}
  if(flash>0){ctx.fillStyle=`rgba(255,40,40,${flash*.45})`;ctx.fillRect(0,0,W,H)}
}
function overlay(title,lines){
  ctx.fillStyle='rgba(8,10,16,.62)';ctx.fillRect(0,0,W,H);
  const u=Math.max(14,Math.min(W,H)*.03);
  text(title,W/2,H*.3,u*3.2,'#fff');
  lines.forEach((l,i)=>text(l,W/2,H*.3+u*3+i*u*1.6,i===lines.length-1?u*1.2:u*1.05,i===lines.length-1?'#ffe14d':'#d6dbe6',undefined,i===lines.length-1?'700':'500'));
}

function blur(){
  const bn=Math.max(0,Math.min(1.35,(P.v-15)/50));if(bn<.02)return;
  ctx.globalAlpha=1;
  const g=ctx.createRadialGradient(W/2,H*.45,H*.35,W/2,H*.45,Math.max(W,H)*.75);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${Math.min(.6,.45*bn)})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(bn>.2){ctx.strokeStyle=`rgba(255,255,255,${Math.min(.3,.14*bn)})`;ctx.lineWidth=1.5;ctx.beginPath();const M2=Math.max(W,H);
    for(let i=0;i<28;i++){const a=Math.random()*6.283,r1=M2*(.35+Math.random()*.2),r2=r1+M2*(.1+.16*bn)*Math.random();ctx.moveTo(vx0+Math.cos(a)*r1,hy+Math.sin(a)*r1*.6);ctx.lineTo(vx0+Math.cos(a)*r2,hy+Math.sin(a)*r2*.6)}ctx.stroke()}
}
const spk=[];
function spark(side){for(let i=0;i<4;i++)spk.push({x:W*(.5+side*(.2+Math.random()*.2)),y:H*(.55+Math.random()*.1),vx:side*(80+Math.random()*220),vy:-60-Math.random()*200,l:.4+Math.random()*.3})}
function drawSparks(dt){ctx.fillStyle='#ffc24a';for(let i=spk.length-1;i>=0;i--){const q=spk[i];q.l-=dt;if(q.l<=0){spk.splice(i,1);continue}q.vy+=700*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;ctx.globalAlpha=Math.min(1,q.l*3);ctx.fillRect(q.x,q.y,3,3)}ctx.globalAlpha=1}
function carPrev(x,y,w,col,cab){
  const h=w*.3;ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(0,h*.62,w*.48,h*.1,0,0,7);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(-w/2,-h*.02,w,h*.5,h*.16);ctx.fill();
  const ch=h*.42*cab;ctx.beginPath();ctx.moveTo(-w*.3,0);ctx.lineTo(-w*.17,-ch);ctx.lineTo(w*.13,-ch);ctx.lineTo(w*.31,0);ctx.fill();
  ctx.fillStyle='#1c2630';ctx.beginPath();ctx.moveTo(-w*.25,-h*.02);ctx.lineTo(-w*.15,-ch*.85);ctx.lineTo(w*.11,-ch*.85);ctx.lineTo(w*.25,-h*.02);ctx.fill();
  for(const wx of[-.3,.3]){ctx.fillStyle='#0e0e10';ctx.beginPath();ctx.arc(w*wx,h*.46,h*.23,0,7);ctx.fill();ctx.fillStyle='#8a8f99';ctx.beginPath();ctx.arc(w*wx,h*.46,h*.1,0,7);ctx.fill()}
  ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(-w/2+h*.1,h*.04,w-h*.2,h*.05);
  ctx.restore();
}
function bar(l,v,x,y,w,u){text(l,x-u*.5,y,u*.9,'#aab','right','500');ctx.fillStyle='#23262e';ctx.fillRect(x,y-u*.7,w,u*.8);ctx.fillStyle='#ffe14d';ctx.fillRect(x,y-u*.7,w*Math.max(0,Math.min(1,v)),u*.8)}
function garage(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#171a23');g.addColorStop(1,'#07080b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const u=Math.max(14,Math.min(W,H)*.03),k=CARS[gi],has=own.includes(gi);
  text('ГАРАЖ',W/2,u*2.6,u*2.2,'#fff');text('Монеты: '+coins,W/2,u*4.3,u*1.1,'#ffe14d');
  text('◀',W*.12,H*.47,u*3,'#667');text('▶',W*.88,H*.47,u*3,'#667');
  carPrev(W/2,H*.45,Math.min(W*.5,H*.85),k.col,k.cab);
  text(k.name,W/2,H*.65,u*1.8,'#fff');
  text(has?(sel===gi?'ВЫБРАНА':'Enter — выбрать'):'Цена '+k.price+' · Enter — купить',W/2,H*.65+u*1.8,u*1.1,has?(sel===gi?'#7bd88f':'#ffe14d'):(coins>=k.price?'#ffe14d':'#ff7a7a'));
  const bx=W/2-u*3,bw=Math.min(W*.25,u*10);
  bar('Скорость',(k.v-55)/40,bx,H*.78,bw,u);bar('Разгон',k.a/12,bx,H*.78+u*1.5,bw,u);bar('Руление',(k.h-.9)/.4,bx,H*.78+u*3,bw,u);
  text(k.n+' передач · отсечка '+k.rl+' об/мин',W/2,H*.78+u*4.7,u*.95,'#8a90a0','center','500');
  text('A / D или ← / → — листать · Esc — назад',W/2,H-u*1.2,u*.95,'#8a90a0','center','500');
  if(popT>0)text(popup,W/2,H*.2,u*1.4,'#ff7a7a');
}
function settingsKey(c){
  if(c==='ArrowUp'||c==='KeyW')srow=(srow+2)%3;else if(c==='ArrowDown'||c==='KeyS')srow=(srow+1)%3;
  else if(c==='ArrowLeft'||c==='KeyA'||c==='ArrowRight'||c==='KeyD'){
    const d=c==='ArrowLeft'||c==='KeyA'?-1:1;
    if(srow===0){vol=Math.max(0,Math.min(1,Math.round((vol+d*.1)*10)/10));sfx.setVol();sfx.bonus(1)}
    else if(srow===1)dens=Math.max(1,Math.min(5,dens+d));
    else manual=!manual;
    save()}
  else if(c==='Escape'||c==='KeyO'||c==='Backspace'||c==='Enter')state=sFrom;
}
function settings(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#171a23');g.addColorStop(1,'#07080b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const u=Math.max(14,Math.min(W,H)*.03);
  text('НАСТРОЙКИ',W/2,u*3,u*2.2,'#fff');
  const rows=[['Громкость звука',vol,Math.round(vol*100)+'%'],['Плотность трафика',(dens-1)/4,['Очень редкий','Редкий','Обычный','Плотный','Очень плотный'][dens-1]],['Коробка передач',manual?1:.02,manual?'Механика (Shift / Ctrl)':'Автомат']];
  rows.forEach((r,i)=>{const y=H*.36+i*u*4.5,on=srow===i,bw=Math.min(W*.5,u*22),x=W/2-bw/2;
    text(r[0],x,y-u*.8,u*1.2,on?'#ffe14d':'#d6dbe6','left');
    ctx.fillStyle='#23262e';ctx.fillRect(x,y,bw,u*.9);ctx.fillStyle=on?'#ffe14d':'#8a90a0';ctx.fillRect(x,y,bw*Math.max(.02,r[1]),u*.9);
    text(r[2],x+bw,y-u*.8,u*1.1,'#fff','right')});
  text('↑ / ↓ — выбрать · ← / → — изменить · Esc — назад',W/2,H-u*1.2,u*.95,'#8a90a0','center','500');
}
function loop(ts){
  const dt=Math.min(.033,(ts-last)/1000||0);last=ts;
  if(state!=='pause'&&state!=='garage'&&state!=='settings')step(dt);if(state==='garage')popT=Math.max(0,popT-dt);
  sfx.update();scene();blur();cockpit();hud();drawSparks(dt);
  if(state==='menu')overlay('ШАШКИ В ПОТОКЕ',['Вид от первого лица · 4 полосы · легковые, грузовики, автобусы','W / ↑ — газ     S / ↓ — тормоз','A / ← и D / → — руль','P или Esc — пауза · R — перезапуск · M — звук','Коробка: '+(manual?'механика · Shift или E — вверх · Ctrl или Q — вниз':'автомат')+' · T — сменить','G — гараж · O — настройки · Монеты: '+coins+' · '+CAR.name,'Пробел или Enter — старт']);
  else if(state==='pause')overlay('ПАУЗА',['Пробел, Enter или P — продолжить · O — настройки']);
  else if(state==='over')overlay('АВАРИЯ',['Очки: '+score()+' · Дистанция: '+(P.z/1000).toFixed(2)+' км','Рекорд: '+best+' · +'+lastGain+' монет · Всего '+coins,'Пробел или Enter — заново · G — гараж · O — настройки']);else if(state==='garage')garage();else if(state==='settings')settings();
  requestAnimationFrame(loop);
}
start();state='menu';requestAnimationFrame(loop);
</script></body></html>
