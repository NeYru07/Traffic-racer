<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шашки в потоке — 3D</title>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px); color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #0b0d12; overflow: hidden; }
  /* Контейнер для двух слоев */
  #game-container { position: relative; width: 100%; height: 100%; }
  /* 3D слой на заднем плане */
  #webgl-canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
  /* 2D слой с прозрачным фоном поверх 3D */
  #c { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
</style>
<!-- Подключаем Three.js как ES-модуль -->
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>
</head>
<body>

<div id="game-container">
  <canvas id="webgl-canvas"></canvas>
  <canvas id="c"></canvas>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const webglCanvas = document.getElementById('webgl-canvas');

let W, H, S=1;

// --- НАСТРОЙКА THREE.JS ---
const scene3D = new THREE.Scene();
scene3D.background = new THREE.Color('#c06c84'); // Цвет неба
scene3D.fog = new THREE.FogExp2('#c06c84', 0.008); // Туман вдали

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ canvas: webglCanvas, antialias: true });
renderer.shadowMap.enabled = true;

// Свет
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene3D.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffe14d, 1.5);
dirLight.position.set(50, 100, -50);
scene3D.add(dirLight);

// Дорога (бесконечная иллюзия)
const roadGeo = new THREE.PlaneGeometry(24, 1000);
const roadMat = new THREE.MeshStandardMaterial({ color: 0x3a3d45, roughness: 0.8 });
const road = new THREE.Mesh(roadGeo, roadMat);
road.rotation.x = -Math.PI / 2;
road.position.y = 0;
scene3D.add(road);

// Трава по бокам
const grassGeo = new THREE.PlaneGeometry(200, 1000);
const grassMat = new THREE.MeshStandardMaterial({ color: 0x355e3b, roughness: 1 });
const grassL = new THREE.Mesh(grassGeo, grassMat);
grassL.rotation.x = -Math.PI / 2; grassL.position.set(-112, -0.1, 0);
scene3D.add(grassL);
const grassR = new THREE.Mesh(grassGeo, grassMat);
grassR.rotation.x = -Math.PI / 2; grassR.position.set(112, -0.1, 0);
scene3D.add(grassR);

function rs() {
  const d = Math.min(devicePixelRatio||1, 2);
  W = document.body.clientWidth; H = document.body.clientHeight;
  cv.width = W*d; cv.height = H*d;
  ctx.setTransform(d,0,0,d,0,0);
  S = Math.max(H, W/1.778);
  
  renderer.setSize(W, H);
  renderer.setPixelRatio(d);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', rs); rs();

// --- БИБЛИОТЕКА 3D МОДЕЛЕЙ ---
const models3D = {
  player: new THREE.Group(),
  sedan: new THREE.Group(),
  hatch: new THREE.Group(),
  bus: new THREE.Group(),
  truck: new THREE.Group()
};

let modelsLoaded = false;
let loadProgress = 'Загрузка 3D моделей...';

const loader = new GLTFLoader();

function extractCar(gltf, bodyKeyword, wheelKeyword, scale = 0.01) {
  const group = new THREE.Group();
  gltf.scene.traverse((child) => {
    if (child.isMesh) {
      if (child.name.includes(bodyKeyword) || child.name.includes(wheelKeyword)) {
        const clone = child.clone();
        clone.position.set(0,0,0);
        group.add(clone);
      }
    }
  });
  group.scale.set(scale, scale, scale);
  group.rotation.y = Math.PI; 
  return group;
}

// Функция для вывода ошибки на экран
function onError(err) {
  console.error("Ошибка загрузки модели:", err);
  loadProgress = "Ошибка загрузки! Открой консоль (F12)";
}

// Загружаем пак трафика 1 (обрати внимание, добавил ./ перед models)
loader.load('./models/generic_passenger_car_pack.glb', (gltf) => {
  models3D.sedan = extractCar(gltf, 'Sedan', 'Wheel_A', 0.012);
  models3D.hatch = extractCar(gltf, 'Hatchback', 'Wheel_B', 0.012);
  checkLoad();
}, undefined, onError);

// Загружаем пак трафика 2
loader.load('./models/low_poly_vehicle_mini_pack_3.glb', (gltf) => {
  models3D.bus = extractCar(gltf, 'city_bus', 'city_bus', 0.015);
  models3D.truck = extractCar(gltf, 'bus_long', 'bus_long', 0.015);
  checkLoad();
}, undefined, onError);

// Загружаем машину игрока
loader.load('./models/lct_3000_95_-_low_poly_model.glb', (gltf) => {
  const car = gltf.scene;
  car.scale.set(0.01, 0.01, 0.01);
  car.rotation.y = Math.PI;
  models3D.player = car;
  checkLoad();
}, undefined, onError);

let loadedCount = 0;
function checkLoad() {
  loadedCount++;
  if(loadedCount >= 3) {
    modelsLoaded = true;
    state = 'menu';
  }
}

// --- ИГРОВАЯ ЛОГИКА (Осталась почти без изменений!) ---
const LW=3.6, HALF=LW*2, LANES=[-5.4, -1.8, 1.8, 5.4], FAR=380, CH=1.15;
const TYPES={car:{w:1.8,h:1.45,L:4.4,v:[22,32]},truck:{w:2.5,h:3.6,L:10,v:[15,20]},bus:{w:2.55,h:3.2,L:12,v:[17,23]}};
const K={L:['ArrowLeft','KeyA'],R:['ArrowRight','KeyD'],U:['ArrowUp','KeyW'],D:['ArrowDown','KeyS']};
let VMAX=68,CAR,KG,MAXS=280,MSTEP=40,sel=0,gi=0,gFrom='menu',own=[0],coins=0,lastGain=0,vol=.8,dens=3,srow=0,sFrom='menu';
const DENS=[6,8,11,14,17];
const TQ=[[800,.35],[1500,.55],[2500,.78],[3500,.93],[4500,1],[5500,1],[6500,.9],[7300,.72]];
function Tn(r){if(r<=TQ[0][0])return TQ[0][1];for(let i=1;i<TQ.length;i++)if(r<=TQ[i][0]){const a=TQ[i-1],b=TQ[i];return a[1]+(b[1]-a[1])*(r-a[0])/(b[0]-a[0])}return TQ[TQ.length-1][1]}

const SHV=[20.4,26,33,42,53.5,68],CARS=[
 {name:'Городской хэтч',price:0,v:62,a:5,h:1,cyl:2,col:'#c0392b',cab:1, mass:1100, cog:0.015},
 {name:'Спорт-седан',price:1500,v:70,a:6.2,h:1.05,cyl:2.2,col:'#2d6cdf',cab:.9, mass:1600, cog:0.01, pops:true},
 {name:'Купе',price:5000,v:80,a:8,h:1.12,cyl:2.6,col:'#e0a020',cab:.8, mass:1450, cog:0.008, pops:true},
 {name:'Суперкар',price:12000,v:92,a:9,h:1.2,cyl:3.2,col:'#27ae60',cab:.65, mass:1300, cog:0.005, pops:true}];
 
let held={},tm=a=>Math.max(...a.map(k=>held[k]||0));
let state='loading',best=0,P,cars,shake=0,flash=0,popup='',popT=0,last=0;
try{best=+localStorage.getItem('tr_best')||0;coins=+localStorage.getItem('tr_coins')||0;own=(localStorage.getItem('tr_own')||'0').split(',').map(Number).filter(n=>n>=0&&n<CARS.length);sel=+localStorage.getItem('tr_sel')||0;const sv=localStorage.getItem('tr_vol'),sd=localStorage.getItem('tr_dens');if(sv!==null)vol=Math.max(0,Math.min(1,+sv));if(sd!==null)dens=Math.max(1,Math.min(5,+sd||3))}catch(e){}
if(!own.includes(sel))sel=0;

function applyCar(){CAR=CARS[sel];VMAX=CAR.v;KG=SHV.map(x=>7000/(x*VMAX/68));const top=VMAX*3.6;MSTEP=[20,30,40,50,60].find(m=>Math.ceil(top/m)<=7)||60;MAXS=Math.ceil(top/MSTEP)*MSTEP;CAR.cd=(CAR.a*Tn(7000)*KG[5]/KG[0]*.98-.35)/(VMAX*VMAX)}
function save(){try{localStorage.setItem('tr_coins',coins);localStorage.setItem('tr_own',own.join(','));localStorage.setItem('tr_sel',sel);localStorage.setItem('tr_vol',vol);localStorage.setItem('tr_dens',dens)}catch(e){}applyCar()}
applyCar();

function garageKey(c){
  if(c==='ArrowLeft'||c==='KeyA')gi=(gi+CARS.length-1)%CARS.length;
  else if(c==='ArrowRight'||c==='KeyD')gi=(gi+1)%CARS.length;
  else if(c==='Enter'||c==='Space'){const k=CARS[gi];
    if(own.includes(gi)){sel=gi;save()}
    else if(coins>=k.price){coins-=k.price;own.push(gi);sel=gi;save()}
    else{popup='Не хватает монет';popT=1.4}}
  else if(c==='Escape'||c==='KeyG'||c==='Backspace')state=gFrom;
}

window.addEventListener('keydown',e=>{
  if(!modelsLoaded) return;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
  if(e.repeat)return;
  held[e.code]=performance.now();
  if(state==='garage'){garageKey(e.code);return}
  if(e.code==='KeyG'&&(state==='menu'||state==='over')){gFrom=state;gi=sel;state='garage';return}
  if(e.code==='Space'||e.code==='Enter'){if(state==='pause')state='play';else if(state!=='play')start()}
  if(e.code==='KeyP'||e.code==='Escape'){if(state==='play')state='pause';else if(state==='pause')state='play'}
});
window.addEventListener('keyup',e=>{held[e.code]=0});

function start(){
  applyCar();
  P={x:LANES[2],vx:0,v:40/3.6,s:0,thr:0,brk:0,z:0,bonus:0,combo:0,comboT:0,roll:0,crash:0,rpm:900,gear:1,pk:0,pkv:0,sh:0,gt:0,popCd:0,offGasT:0};
  
  // Очищаем старые 3D объекты машин из сцены
  if(cars) cars.forEach(c => scene3D.remove(c.mesh));
  
  cars=[]; shake=0; flash=0; popT=0; state='play';
  for(let i=0;i<DENS[dens-1];i++) spawn(45+i*330/DENS[dens-1]);
}

function spawn(zr){
  for(let n=0;n<8;n++){
    const r=Math.random(),k=r<.62?'car':r<.82?'truck':'bus',T=TYPES[k],ln=Math.random()*4|0,z=P.z+zr+Math.random()*20;
    if(cars.some(c=>c.ln===ln&&Math.abs(c.z-z)<34))continue;
    const band=new Set(cars.filter(c=>Math.abs(c.z-z)<26).map(c=>c.ln));band.add(ln);
    if(band.size>2)continue;
    
    const car=k==='car',vv0=T.v[0]+Math.random()*(T.v[1]-T.v[0]);
    let ahead=null;for(const o of cars)if(o.ln===ln&&o.z>z&&(!ahead||o.z<ahead.z))ahead=o;
    const vv=ahead&&ahead.z-z<80?Math.min(vv0,ahead.v):vv0;
    
    // ВЫБОР 3D МОДЕЛИ ИЗ ШАБЛОНОВ
    let meshTemplate = models3D.sedan;
    if (k === 'car' && Math.random() > 0.5) meshTemplate = models3D.hatch;
    if (k === 'bus') meshTemplate = models3D.bus;
    if (k === 'truck') meshTemplate = models3D.truck;
    
    const mesh = meshTemplate.clone();
    scene3D.add(mesh);

    cars.push({k,T,ln,x:LANES[ln],z,v0:vv0,v:vv,home:ln,cd:0, gap:9, passed:false, nt:4+Math.random()*8, mesh});
    return;
  }
}

function hit(){ P.crash=.001; shake=1; flash=1; P.roll=(Math.random()<.5?-1:1)*.1; popup=''; }
const score=()=>(P.z/10|0)+P.bonus;

function step(dt){
  const crashed=P.crash>0,L=tm(K.L),R=tm(K.R),U=tm(K.U),D=tm(K.D);
  const dir=L&&R?(L>R?-1:1):L?-1:R?1:0,vn=P.v/VMAX;
  
  if(state==='menu'){P.v=24;P.s=0}
  else if(!crashed){
    P.thr+=((U?1:0)-P.thr)*Math.min(1,dt*(U?5:9));
    P.brk+=((D?1:0)-P.brk)*Math.min(1,dt*12);
    const wf2=Tn(P.rpm)*KG[P.gear-1]/KG[0]*CAR.a;
    const a=P.thr*(P.sh>0?.25:1)*wf2-P.brk*30-(.35+CAR.cd*P.v*P.v)-(1-P.thr)*.9*Math.max(0,P.rpm-900)/6400;
    P.v=Math.max(P.brk>.1?0:10,P.v+a*dt);

    const maxSteer = 1 - (vn * 0.55); 
    const targetSteer = dir * maxSteer;
    const steerRate = dir === 0 ? 14 : (P.s * dir < 0 ? 20 : 10);
    P.s += (targetSteer - P.s) * Math.min(1, steerRate * dt);
    
    const latAccel = P.s * 13 * CAR.h * Math.max(0.4, 1 - vn * 0.35);
    const inertia = 18000 / CAR.mass; 
    P.vx += (latAccel - P.vx) * Math.min(1, inertia * dt);
    P.x += P.vx * dt;

    P.roll += (-P.vx * CAR.cog - P.roll) * Math.min(1, 12 * dt);

    const lim=HALF-.95;
    if(Math.abs(P.x)>lim){P.x=Math.sign(P.x)*lim;P.vx=-P.vx*.15;P.v*=1-1.2*dt;shake=Math.max(shake,.25);}
  }else{
    P.v=Math.max(0,P.v-45*dt);P.vx*=.9;P.s*=.95;P.roll*=.95;P.crash+=dt;
    if(P.crash>1.4&&state==='play'){state='over';lastGain=score();coins+=lastGain;save();if(score()>best){best=score();try{localStorage.setItem('tr_best',best)}catch(e){}}}
  }
  
  P.sh=Math.max(0,P.sh-dt);P.gt=Math.max(0,P.gt-dt);
  if(P.sh<=0&&P.gt<=0){
    const g=P.gear,up=7200,dn=4200+600*P.thr+(P.brk>.3?500:0);let tg=g;
    while(tg<6&&P.v*KG[tg-1]>=up&&P.v*KG[tg]>dn+500)tg++;          
    while(tg>1&&P.v*KG[tg-1]<dn&&P.v*KG[tg-2]<6900)tg--;           
    if(tg!==g){P.gear=tg;P.sh=.22;P.gt=tg>g?.7:.5;if(tg>g&&P.thr>.2&&P.crash===0&&state==='play'){P.pkv+=.22;}}
  }
  P.pkv+=(-120*(P.pk-(P.thr*.005-P.brk*.014))-14*P.pkv)*dt;P.pk+=P.pkv*dt;
  const tgt=Math.min(7300,Math.max(P.v*KG[P.gear-1],900+(P.gear===1?P.thr*2200:0)));
  P.rpm+=(tgt-P.rpm)*Math.min(1,dt*(tgt<P.rpm?14:22));
  P.z+=P.v*dt;P.comboT-=dt;if(P.comboT<=0)P.combo=0;
  shake=Math.max(0,shake-dt*1.6);flash=Math.max(0,flash-dt*1.5);popT=Math.max(0,popT-dt);
  
  cars.sort((a,b)=>b.z-a.z);
  for(const c of cars){
    ai(c,dt);c.z+=c.v*dt;
    if(state!=='play'||P.crash>0&&c.passed)continue;
    const rel=c.z-P.z,gap=Math.abs(c.x-P.x)-(.9+c.T.w/2);
    if(c.passed)continue;
    if(rel+c.T.L<-2.4){
        c.passed=true;
        if(c.gap>0&&c.gap<1&&P.v>16&&P.crash===0){
            P.combo=P.comboT>0?P.combo+1:1;P.comboT=2.5;
            const b=50*Math.min(P.combo,5);P.bonus+=b;popup='БЛИЗКИЙ ОБГОН +'+b;popT=1.4;
        }
    }
    else if(rel<1.9){c.gap=Math.min(c.gap,gap);if(gap<-.06&&P.crash===0)hit()}
  }
  
  // Удаляем отставшие машины и добавляем новые
  cars = cars.filter(c => {
      if(c.z - P.z < -45) { scene3D.remove(c.mesh); return false; }
      return true;
  });
  while(cars.length < DENS[dens-1]){const n=cars.length;spawn(260+Math.random()*120);if(cars.length===n)break}
}

function safe(c,to){
  const L=c.T.L;
  for(const o of cars){
    if(o===c||!(o.ln===to||o.to===to))continue;
    if(o.z>c.z){if(o.z-(c.z+L)<6+Math.max(0,c.v-o.v)*1.5)return false}
    else if(c.z-(o.z+o.T.L)<6+Math.max(0,o.v-c.v)*1.8)return false;
  }
  if(Math.abs(P.x-LANES[to])<3){
    if(c.z>P.z+1.9){if(c.z-(P.z+1.9)<8+Math.max(0,P.v-c.v)*2.2)return false}
    else if(c.z+L<P.z-2.4){if(P.z-2.4-(c.z+L)<6+Math.max(0,c.v-P.v)*1.5)return false}
    else return false;
  }
  return true;
}

function ai(c,dt){
  const L=c.T.L;let ld=null,gap=1e9;
  for(const o of cars){if(o===c||o.z<=c.z||Math.abs(o.x-c.x)>=(c.T.w+o.T.w)/2+.25)continue;const g=o.z-(c.z+L);if(g<gap){gap=g;ld=o}}
  const free=1-Math.pow(c.v/c.v0,4);let acc=2.2*free;
  if(ld){const sx=4+c.v*1.2+c.v*(c.v-ld.v)/(2*Math.sqrt(7.7));acc=2.2*(free-Math.pow(Math.max(sx,0)/Math.max(gap,.5),2))}
  acc=Math.max(-9,Math.min(2.2,acc));c.br=acc<-1.2;c.v=Math.max(0,c.v+acc*dt);
  if(ld&&gap<.8){c.z=ld.z-L-.8;c.v=Math.min(c.v,ld.v)}
  c.cd-=dt;c.nt-=dt;
  if(c.to!==undefined){
    if(c.warn>0){c.warn-=dt;if(!safe(c,c.to)){c.to=undefined;c.cd=2}}
    else{
      if(c.cp<.7&&!c.rv&&Math.abs(P.x-c.x)<2.9&&P.z+1.9>c.z-1&&P.z-2.4<c.z+c.T.L+1){c.to=c.ln;c.fx=c.x;c.cp=0;c.rv=1}
      c.cp=Math.min(1,c.cp+dt/1.8);const e=c.cp*c.cp*(3-2*c.cp);c.x=c.fx+(LANES[c.to]-c.fx)*e;
      if(c.cp>=1){c.ln=c.to;c.to=undefined;c.rv=0;c.cd=4}
    }
    return;
  }
  if(c.cd>0||P.z<300)return;
  const slow=ld&&gap<22+c.v*1.3&&c.v0-ld.v>2.5;let dirs=null;
  if(slow)dirs=Math.random()<.5?[-1,1]:[1,-1];
  else if(c.nt<=0){c.nt=10+Math.random()*15;
    if(c.ln!==c.home&&Math.random()<.6)dirs=[Math.sign(c.home-c.ln)];
    else if(Math.random()<.05)dirs=[Math.random()<.5?-1:1]}
  if(!dirs)return;
  for(const d of dirs){const to=c.ln+d;if(to<0||to>3||!safe(c,to))continue;
    if(slow&&cars.some(o=>o!==c&&(o.ln===to||o.to===to)&&o.z>c.z&&o.z-(c.z+L)<45&&o.v<c.v0-2.5))continue;
    c.to=to;c.warn=1.2;c.fx=c.x;c.cp=0;return}
  if(slow)c.cd=.6;
}

// --- РЕНДЕРИНГ 3D И 2D ---
function render3D() {
  if (!modelsLoaded || !P) return;
  
  // Тряска камеры при аварии
  let sx=0, sy=0;
  if(shake>0){ sx=(Math.random()-.5)*shake*0.5; sy=(Math.random()-.5)*shake*0.5; }
  
  // Устанавливаем позицию камеры от первого лица. Обрати внимание на знак минус перед P.z!
  camera.position.set(P.x + sx, CH + sy + P.pk*0.1, -P.z);
  camera.rotation.z = -P.roll;
  camera.rotation.y = -P.s * 0.05; // Легкий поворот головы за рулем
  
  // Двигаем дорогу за игроком (чтобы избежать потери точности float)
  road.position.z = -P.z - 500;
  grassL.position.z = -P.z - 500;
  grassR.position.z = -P.z - 500;

  // Обновляем позиции машин трафика
  for(const c of cars){
    if(c.mesh) {
        c.mesh.position.set(c.x, 0, -c.z);
        // Машина слегка кренится при перестроении
        if(c.to !== undefined) c.mesh.rotation.z = (c.to > c.ln ? -1 : 1) * 0.03;
        else c.mesh.rotation.z = 0;
    }
  }
  
  renderer.render(scene3D, camera);
}

// 2D Отрисовка кабины (без изменений)
const M=(a,b)=>[W/2+(a-.5)*S*1.778,H-(1-b)*S];
function wsP(){const p=M;ctx.moveTo(...p(.30,.605));ctx.lineTo(...p(.283,.27));ctx.quadraticCurveTo(...p(.283,.215),...p(.34,.208));ctx.lineTo(...p(1.7,.19));ctx.lineTo(...p(1.7,.605));ctx.closePath()}
function sdP(){const p=M;ctx.moveTo(...p(0,.1));ctx.lineTo(...p(.14,.37));ctx.lineTo(...p(.215,.62));ctx.lineTo(...p(.197,.71));ctx.lineTo(...p(0,.805));ctx.closePath()}
function dial(x,y,r,v,max,step,lab,red){
  ctx.fillStyle='#0b0c0f';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.strokeStyle='#30343c';ctx.lineWidth=r*.05;ctx.stroke();
  const A=a=>.75*Math.PI+a/max*1.5*Math.PI;
  if(red){ctx.strokeStyle='#e0262d';ctx.lineWidth=r*.07;ctx.beginPath();ctx.arc(x,y,r*.92,A(red),A(max));ctx.stroke()}
  ctx.fillStyle='#dfe3ea';ctx.strokeStyle='#dfe3ea';ctx.textAlign='center';ctx.font=`600 ${r*(max>1000?.2:.17)}px system-ui,sans-serif`;
  for(let i=0;i<=max/step;i++){const a=A(i*step),c=Math.cos(a),s=Math.sin(a);
    ctx.lineWidth=r*.03;ctx.beginPath();ctx.moveTo(x+c*r*.78,y+s*r*.78);ctx.lineTo(x+c*r*.88,y+s*r*.88);ctx.stroke();
    const l=lab(i);if(l!=='')ctx.fillText(l,x+c*r*.62,y+s*r*.62+r*.07)}
  const a=A(Math.min(v,max)),c=Math.cos(a),s=Math.sin(a);
  ctx.strokeStyle='#ff3b2f';ctx.lineWidth=r*.04;ctx.beginPath();ctx.moveTo(x-c*r*.15,y-s*r*.15);ctx.lineTo(x+c*r*.85,y+s*r*.85);ctx.stroke();
  ctx.fillStyle='#1b1d22';ctx.beginPath();ctx.arc(x,y,r*.09,0,7);ctx.fill();
}
function cockpit(){
  ctx.clearRect(0, 0, cv.width, cv.height); // Очищаем 2D холст, чтобы было видно 3D
  if(state === 'loading') return;
  const p=M;
  ctx.save();ctx.beginPath();ctx.rect(-5,-5,W+10,H+10);wsP();sdP();
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#040405');g.addColorStop(.6,'#0e0f12');g.addColorStop(1,'#07080a');
  ctx.fillStyle=g;ctx.fill('evenodd');
  ctx.strokeStyle='rgba(255,255,255,.09)';ctx.lineWidth=2;ctx.beginPath();wsP();sdP();ctx.stroke();
  ctx.save();ctx.beginPath();wsP();ctx.clip();
  g=ctx.createLinearGradient(0,p(0,.45)[1],0,p(0,.605)[1]);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(255,255,255,.1)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore();
  
  g=ctx.createLinearGradient(0,p(0,.6)[1],0,p(0,.66)[1]);g.addColorStop(0,'#1d1e24');g.addColorStop(1,'rgba(14,15,18,0)');
  ctx.fillStyle=g;ctx.fillRect(p(.29,0)[0],p(0,.6)[1],W,S*.06);
  const [dx0,dy0]=p(.65,.64),[dx1,dy1]=p(.84,.73);
  ctx.fillStyle='#050607';ctx.strokeStyle='#23252b';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(dx0,dy0,dx1-dx0,dy1-dy0,6);ctx.fill();ctx.stroke();
  
  const gx1=W/2-.085*S,gx2=W/2+.085*S,gy=H-.26*S,r=.062*S;
  ctx.fillStyle='#08080a';ctx.strokeStyle='#1f2127';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(gx1-r*1.35,gy-r*1.25,gx2-gx1+r*2.7,r*2.5,r*.5);ctx.fill();ctx.stroke();
  const kmh=P.v*3.6;
  dial(gx1,gy,r,kmh,MAXS,MSTEP/2,i=>i%2===0?String(i*MSTEP/2):'');
  dial(gx2,gy,r,P.rpm,8000,1000,i=>String(i),6500);
  ctx.fillStyle='#fff';ctx.textAlign='center';
  ctx.font=`700 ${r*.34}px system-ui,sans-serif`;ctx.fillText(Math.round(kmh),gx1,gy+r*.64);
  ctx.font=`700 ${r*.38}px system-ui,sans-serif`;ctx.fillText(P.gear,gx2,gy+r*.64);
  
  const [hx,hy2]=p(.5,.92),R=.3*S;
  ctx.save();ctx.translate(hx,hy2);ctx.rotate(P.s*.85);ctx.lineCap='round';
  ctx.strokeStyle='#121316';ctx.lineWidth=R*.2;ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.stroke();
  ctx.strokeStyle='#2a2c33';ctx.lineWidth=R*.02;ctx.beginPath();ctx.arc(0,0,R*1.06,Math.PI*1.15,Math.PI*1.85);ctx.stroke();
  ctx.setLineDash([R*.04,R*.04]);ctx.strokeStyle='#5a5d66';ctx.lineWidth=R*.012;ctx.beginPath();ctx.arc(0,0,R*.93,0,7);ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle='#121316';ctx.lineWidth=R*.2;ctx.beginPath();ctx.moveTo(-R,0);ctx.lineTo(R,0);ctx.moveTo(0,0);ctx.lineTo(0,R);ctx.stroke();
  ctx.fillStyle='#0d0e11';ctx.strokeStyle='#2a2c33';ctx.lineWidth=R*.015;ctx.beginPath();ctx.arc(0,0,R*.34,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle=CAR.col;ctx.beginPath();ctx.arc(0,0,R*.08,0,7);ctx.fill();
  ctx.fillStyle=CAR.col;ctx.fillRect(-R*.012,-R*1.1,R*.024,R*.2);
  ctx.restore();ctx.restore();
}

function text(t,x,y,size,col,al='center',w='700'){ctx.font=`${w} ${size}px system-ui,'Segoe UI',sans-serif`;ctx.textAlign=al;ctx.fillStyle=col;ctx.fillText(t,x,y)}
function hud(){
  if(state==='menu'||state==='garage'||state==='settings'||state==='loading')return;
  const u=Math.max(14,Math.min(W,H)*.03);
  text('ОЧКИ '+score(),W-20,u*1.6,u*1.3,'#fff','right');
  text('Дистанция '+(P.z/1000).toFixed(2)+' км · Рекорд '+best,W-20,u*2.9,u*.9,'#ffd9a0','right','500');
  if(popT>0){ctx.globalAlpha=Math.min(1,popT);text(popup,W/2,H*.22,u*1.6,'#ffe14d');ctx.globalAlpha=1}
  if(flash>0){ctx.fillStyle=`rgba(255,40,40,${flash*.45})`;ctx.fillRect(0,0,W,H)}
}

function overlay(title,lines){
  ctx.fillStyle='rgba(8,10,16,.62)';ctx.fillRect(0,0,W,H);
  const u=Math.max(14,Math.min(W,H)*.03);
  text(title,W/2,H*.3,u*3.2,'#fff');
  lines.forEach((l,i)=>text(l,W/2,H*.3+u*3+i*u*1.6,i===lines.length-1?u*1.2:u*1.05,i===lines.length-1?'#ffe14d':'#d6dbe6',undefined,i===lines.length-1?'700':'500'));
}

function garage(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#171a23');g.addColorStop(1,'#07080b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const u=Math.max(14,Math.min(W,H)*.03),k=CARS[gi],has=own.includes(gi);
  text('ГАРАЖ',W/2,u*2.6,u*2.2,'#fff');text('Монеты: '+coins,W/2,u*4.3,u*1.1,'#ffe14d');
  text(k.name,W/2,H*.65,u*1.8,'#fff');
  text(has?(sel===gi?'ВЫБРАНА':'Enter — выбрать'):'Цена '+k.price+' · Enter — купить',W/2,H*.65+u*1.8,u*1.1,has?(sel===gi?'#7bd88f':'#ffe14d'):(coins>=k.price?'#ffe14d':'#ff7a7a'));
  text('← / → — листать · Esc — назад',W/2,H-u*1.2,u*.95,'#8a90a0','center','500');
}

function loop(ts){
  const dt=Math.min(.033,(ts-last)/1000||0);last=ts;
  if(state!=='pause'&&state!=='garage'&&state!=='settings'&&state!=='loading')step(dt);
  
  render3D();
  cockpit();
  hud();
  
  if(state==='loading') overlay(loadProgress, ['Подождите...']);
  else if(state==='menu') overlay('ШАШКИ В ПОТОКЕ 3D',['W / ↑ — газ     S / ↓ — тормоз','A / ← и D / → — руль','G — гараж · Монеты: '+coins+' · '+CAR.name,'Пробел или Enter — старт']);
  else if(state==='pause') overlay('ПАУЗА',['Пробел, Enter или P — продолжить']);
  else if(state==='over') overlay('АВАРИЯ',['Очки: '+score()+' · Дистанция: '+(P.z/1000).toFixed(2)+' км','Рекорд: '+best+' · Всего '+coins,'Пробел или Enter — заново · G — гараж']);
  else if(state==='garage') garage();
  
  requestAnimationFrame(loop);
}

// Заглушка, чтобы не падало до загрузки
applyCar();
P={x:0,vx:0,v:0,s:0,thr:0,brk:0,z:0,bonus:0,combo:0,comboT:0,roll:0,crash:0,rpm:900,gear:1,pk:0,pkv:0,sh:0,gt:0};
requestAnimationFrame(loop);

</script>
